name: ayostaff
description: "Application mobile AYOS Intérim"
publish_to: 'none'

version: 1.0.1+6

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  provider: ^6.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.6
  go_router: ^16.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  file_picker: ^11.0.3
  mobile_scanner: ^7.4.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/iconAyos.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/iconAyos.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash.png
    - assets/images/logo1.png
    - assets/images/logo2.png
    - assets/images/LogoAyos1.png
    - assets/images/LogoAyos2.png
